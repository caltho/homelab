name: homelab

services:
  # ---------------------------------------------------------------------------
  # Home Assistant — host network mode (required for device/mDNS discovery)
  # ---------------------------------------------------------------------------
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    privileged: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /mnt/ssd:/media/ssd:ro   # Samsung T5 files, appears in HA Media browser (read-only)
    restart: unless-stopped
    # Detects the "process alive but web server hung" failure mode. The host
    # watchdog (scripts/ha-watchdog.sh, cron) restarts HA when this goes unhealthy.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Plex — host network mode + Intel Quick Sync (QSV) hardware transcoding.
  # /dev/dri is the Intel iGPU render node; group_add gives access to it.
  # ---------------------------------------------------------------------------
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"   # 'render' group — required to use /dev/dri/renderD128
    volumes:
      - ${DATA_ROOT}/plex/config:/config
      - ${DATA_ROOT}/media:/media
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Samba — shares the media directory over SMB so you can drop in files.
  # ---------------------------------------------------------------------------
  samba:
    image: dockurr/samba
    container_name: samba
    environment:
      - NAME=Media
      - USER=${SAMBA_USER}
      - PASS=${SAMBA_PASS}
      - UID=${PUID}
      - GID=${PGID}
    ports:
      - "445:445"
    volumes:
      - ${DATA_ROOT}/media:/storage
      # exFAT-safe config (no xattr/stream metadata). See config/samba/smb.conf
      # for why the image defaults break macOS Finder copies.
      - ./config/samba/smb.conf:/etc/samba/smb.conf:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Portainer — Docker management UI. Mounts the docker socket (read-only).
  # Reachable directly on :9443 (https) or via Caddy at portainer.<DOMAIN>.
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/portainer:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy. Proxies to the host-network services above via the
  # host gateway. TLS mode is configured in caddy/Caddyfile.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      - SITE_DOMAIN=${SITE_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro   # public static site content
      - ${DATA_ROOT}/caddy/data:/data
      - ${DATA_ROOT}/caddy/config:/config
    restart: unless-stopped

  # NOTE: cloudflared is commented out until the tunnel exists. To enable:
  #   1. (done) naarmsubcritical.com is registered + on Cloudflare nameservers
  #   2. cloudflared tunnel login && cloudflared tunnel create bongripper
  #   3. cp cloudflared/config.yml.template cloudflared/config.yml, fill in the UUID
  #   4. uncomment the block below, then: docker compose up -d
#  # ---------------------------------------------------------------------------
#  # cloudflared — Cloudflare Tunnel. Makes an *outbound* connection to Cloudflare
#  # and serves the public site through it, so no router port-forward is needed
#  # and the home IP stays out of public DNS.
#  #
#  # Ingress rules live in cloudflared/config.yml (tracked in git). The tunnel
#  # credentials in ~/.cloudflared are secrets and are NOT tracked — recreate them
#  # with `cloudflared tunnel login && cloudflared tunnel create <name>`.
