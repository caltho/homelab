# Samba config for the Media share (Samsung T5, exFAT).
#
# WHY THIS FILE EXISTS
# --------------------
# The share is backed by exFAT, which supports NO extended attributes at all
# (setfattr on the mount returns "Operation not supported"). The dockurr/samba
# default config assumes a filesystem that does, and enables:
#
#     ea support     = yes
#     vfs objects    = catia fruit streams_xattr
#     fruit:metadata = stream
#
# That combination tells macOS the server supports named streams, so Finder
# stores its metadata in a <file>:AFP_AfpInfo stream, which vfs_streams_xattr
# then tries to write as an xattr. On exFAT that write always fails:
#
#     fruit_pwrite_meta_stream: On-demand create [<file>:AFP_AfpInfo] in write
#     failed: No such file or directory
#
# Finder aborts the copy at that point, leaving a 0-byte file at the
# destination and showing "error code 100093". Linux and Windows clients were
# never affected because they do not write AFP_AfpInfo.
#
# THE FIX
# -------
# vfs_fruit and streams_xattr are removed entirely. Samba then does not
# advertise named-stream support, so macOS does not attempt the stream write.
# Finder falls back to storing Apple metadata in AppleDouble "._" sidecar
# files, which are ordinary files that exFAT stores without complaint. This is
# the long-standing arrangement for SMB shares on FAT-family filesystems.
#
# Trade-off: no AAPL extensions (marginally slower Finder directory listings)
# and no Time Machine support. Neither is used here.
#
# catia is kept deliberately: it maps characters that are legal on macOS but
# illegal on exFAT (" * : < > ? \ |), which prevents a separate class of copy
# failure.
#
# IF THE DRIVE IS EVER REFORMATTED TO ext4, the upstream defaults become safe
# again and can be restored for better macOS performance.

[global]
    server string = samba
    idmap config * : range = 3000-7999
    security = user
    server min protocol = SMB2

    # disable printing services
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    host msdfs = no
    wide links = yes
    follow symlinks = yes
    unix extensions = no
    acl allow execute always = yes

    # exFAT cannot store extended attributes, so everything that depends on
    # them is off. Leaving these on causes write failures, not just warnings.
    ea support = no
    store dos attributes = no
    map archive = no
    map hidden = no
    map system = no
    map readonly = no

    # No fruit, no streams_xattr. See the header comment above.
    vfs objects = catia

    # fix filenames with special chars (should be default)
    mangled names = no
    dos charset = CP850
    unix charset = UTF-8

[Media]
    path = /storage
    comment = Shared
    browseable = yes
    writable = yes
    read only = no

    force user = callum
    force group = smb
